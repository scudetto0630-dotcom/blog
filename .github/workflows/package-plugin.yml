name: Package reviewed WordPress plugin
on:
  push:
    branches: [main]
    paths:
      - 'hirogaru-home/**'
      - 'tools/package-blog-plugin.py'
      - '.github/workflows/package-plugin.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: package-reviewed-plugin
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build bounded archive from reviewed files
        run: python3 tools/package-blog-plugin.py
      - name: Record archive without publishing WordPress
        run: |
          if git diff --quiet -- hirogaru-home.zip; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hirogaru-home.zip
          git commit -m 'Package reviewed WordPress plugin archive'
          git push origin HEAD:main
