name: Blog public health check
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check editorial rules and fact-signature regressions
        run: |
          python -m unittest discover -s tests -p test_editorial_quality.py
          python -m unittest discover -s tests -p test_writing_reference.py
          python -m unittest discover -s tests -p test_search_period_review.py
          python -m unittest discover -s tests -p test_story_application.py
          python -m unittest discover -s tests -p test_product_operations.py
          python tools/editorial-quality.py --output editorial-quality.json
      - name: Check public pages and internal links
        run: python tools/blog-audit.py --output blog-audit.json
      - name: Check complete reader navigation and structured data
        run: python tools/audit-reader.py > reader-audit.json
      - name: Check official product source URLs
        if: always()
        run: python tools/audit-product-sources.py --output product-source-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blog-audit
          path: |
            blog-audit.json
            reader-audit.json
            product-source-audit.json
            editorial-quality.json
          retention-days: 30

  japanese-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/proofreading/package-lock.json
      - name: Install Japanese proofreading tools
        run: npm ci --prefix tools/proofreading --no-audit --no-fund
      - name: Collect public Japanese copy
        run: python tools/proofread-site.py --output /tmp/blog-copy
      - name: Proofread public Japanese copy
        run: tools/proofreading/node_modules/.bin/textlint --config tools/proofreading/.textlintrc.json --format json '/tmp/blog-copy/*.md' > proofreading.json
      - name: Summarize findings without suppressing the proofreading result
        if: always() && hashFiles('proofreading.json') != ''
        run: |
          python tools/proofreading-summary.py proofreading.json --output proofreading-summary.md
          cat proofreading-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: japanese-proofreading
          path: |
            proofreading.json
            proofreading-summary.md
            /tmp/blog-copy/*.md
          retention-days: 30

  browser-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/browser-audit/package-lock.json
      - run: npm ci --prefix tools/browser-audit --no-audit --no-fund
      - run: tools/browser-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Build isolated reader fixtures
        run: |
          php tests/quality.php > quality-php.txt
          python tools/build-quality-preview.py quality-php.txt --output /tmp/quality-preview
      - name: Check saved records, import, notes, print and no-JS reading
        env:
          HSH_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/browser-audit/node_modules/playwright
          HSH_READER_PREVIEW: /tmp/quality-preview
        run: |
          export HSH_CHROMIUM="$(node -e "process.stdout.write(require('./tools/browser-audit/node_modules/playwright').chromium.executablePath())")"
          node tests/studio-browser.cjs
          node tests/quality-browser.cjs
      - name: Check public layouts and retain screenshots
        env:
          NODE_PATH: tools/browser-audit/node_modules
        run: node tools/public-browser-audit.cjs browser-audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-layout
          path: browser-audit/
          retention-days: 30
