name: Blog public health check
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check public pages and internal links
        run: python tools/blog-audit.py --output blog-audit.json
      - name: Check complete reader navigation and structured data
        run: python tools/audit-reader.py > reader-audit.json
      - name: Check official product source URLs
        if: always()
        run: python tools/audit-product-sources.py --output product-source-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blog-audit
          path: |
            blog-audit.json
            reader-audit.json
            product-source-audit.json
          retention-days: 30

  japanese-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/proofreading/package-lock.json
      - name: Install Japanese proofreading tools
        run: npm ci --prefix tools/proofreading --no-audit --no-fund
      - name: Collect public Japanese copy
        run: python tools/proofread-site.py --output /tmp/blog-copy
      - name: Proofread public Japanese copy
        run: tools/proofreading/node_modules/.bin/textlint --config tools/proofreading/.textlintrc.json --format json '/tmp/blog-copy/*.md' > proofreading.json
      - name: Summarize findings without suppressing the proofreading result
        if: always() && hashFiles('proofreading.json') != ''
        run: |
          python tools/proofreading-summary.py proofreading.json --output proofreading-summary.md
          cat proofreading-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: japanese-proofreading
          path: |
            proofreading.json
            proofreading-summary.md
            /tmp/blog-copy/*.md
          retention-days: 30
